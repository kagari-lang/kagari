name = "Kagari"
grammar = "kagari"
path_suffixes = ["kgr"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
hard_tabs = false
autoclose_before = ")]}"

brackets = [
  { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
  { start = '"', end = '"', close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

# A smaller override replaces the surrounding string scope inside expression holes.
[overrides.interpolation]
