[package]
name = "kagari-syntax-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
kagari-common.workspace = true
kagari-source.workspace = true
kagari-syntax.workspace = true
libfuzzer-sys = { version = "0.4", optional = true }

[[bin]]
name = "syntax"
path = "fuzz_targets/syntax.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]
