[package]
name = "kagari-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
jit = []
execution-diagnostics = []
serde = ["dep:serde"]
web = ["dep:web-time"]

[dependencies]
kagari-types.workspace = true
bincode.workspace = true
kagari-abi.workspace = true
kagari-contract.workspace = true
thiserror.workspace = true
kagari-common.workspace = true
kagari-bytecode.workspace = true
serde = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { version = "=1.1.0", optional = true }

[dev-dependencies]
kagari-derive.workspace = true
kagari-stdlib.workspace = true
kagari-hir.workspace = true
kagari-source.workspace = true
kagari-compiler = { workspace = true, features = ["source"] }
kagari-mir.workspace = true
