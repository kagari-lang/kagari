[package]
# Test helpers use named modules; only the targets below are standalone tests.
autotests = false
name = "kagari-vm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kagari-types.workspace = true
kagari-abi.workspace = true
kagari-contract.workspace = true
kagari-common.workspace = true
kagari-bytecode.workspace = true
kagari-runtime.workspace = true

[dev-dependencies]
rstest.workspace = true
kagari-derive.workspace = true
kagari-stdlib.workspace = true
kagari-source.workspace = true
kagari-compiler = { workspace = true, features = ["source"] }
kagari-mir.workspace = true
kagari-common.workspace = true
kagari-hir.workspace = true
kagari-bytecode.workspace = true
kagari-syntax.workspace = true

[[test]]
name = "allocation_contracts"
path = "tests/allocation_contracts/main.rs"

[[test]]
name = "library_measurements"
path = "tests/library_measurements.rs"
