[package]
name = "kagari-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
kagari-common.workspace = true
kagari-hir.workspace = true
kagari-package.workspace = true
kagari-source.workspace = true
kagari-stdlib.workspace = true
kagari-syntax.workspace = true
kagari-types.workspace = true
lattice-actor = { git = "https://github.com/realm-labs/lattice", rev = "10df090d7912df233e28fbe2c2ef3f223dafcdbb" }
lsp-types = "0.97.0"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }

[features]
verification = ["kagari-hir/work-metrics"]

[dev-dependencies]
rstest.workspace = true

[[bench]]
name = "lsp_memory"
path = "benches/lsp_memory/main.rs"
harness = false
test = false
required-features = ["verification"]
