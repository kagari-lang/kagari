[package]
name = "kagari-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
kagari-package.workspace = true
kagari-types.workspace = true
kagari-source.workspace = true
thiserror.workspace = true
kagari-common.workspace = true
kagari-embed = { workspace = true, features = ["source"] }
kagari-bytecode.workspace = true
kagari-codegen-cranelift = { workspace = true, optional = true }
kagari-syntax.workspace = true
kagari-runtime.workspace = true
kagari-vm.workspace = true

[features]
default = []
jit = ["dep:kagari-codegen-cranelift", "kagari-embed/native"]
