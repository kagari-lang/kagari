name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: "3.12"

      - name: Test structure checker
        run: uv run --locked scripts/check_structure.py --self-test

      - name: Check all Rust source structure
        run: uv run --locked scripts/check_structure.py

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv for feature consumers
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: "3.12"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run host-driven async example
        run: cargo run --locked -p kagari-embed --no-default-features --features source --example async_tasks

      - name: Check standalone SDK feature consumers
        run: uv run python scripts/check_features.py

      - name: Test CLI native feature
        run: cargo test -p kagari-cli --features jit
