name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz syntax contracts
        run: |
          mkdir -p target/fuzz-corpus/syntax
          cargo +nightly fuzz run syntax --features fuzzing target/fuzz-corpus/syntax fuzz/seeds/syntax -- -max_total_time=60 -max_len=131072 -timeout=10 -rss_limit_mb=2048

      - name: Upload failing syntax inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: syntax-fuzz-failures
          path: fuzz/artifacts/syntax/
          if-no-files-found: ignore

  structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          python-version: "3.12"

      - name: Test structure checker
        run: uv run --locked scripts/check_structure.py --self-test

      - name: Check all Rust source structure
        run: uv run --locked scripts/check_structure.py

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv for feature consumers
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          python-version: "3.12"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check frontend benchmark tooling
        run: uv run python -m unittest discover -s scripts/tests -p 'test_*benchmark.py'

      - name: Check HIR benchmark evidence
        run: uv run python scripts/benchmark_hir.py --check

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      - name: Upload failing GC operation traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gc-graph-failures
          path: target/gc-graph-failures/*.trace
          if-no-files-found: ignore

      - name: Run complete formatter grammar inventory
        run: 'cargo test --locked -p kagari-format --lib tests::complete_grammar_fixture_inventory:: -- --ignored'

      - name: Run host-driven async example
        run: cargo run --locked -p kagari --no-default-features --features source --example async_tasks

      - name: Check standalone SDK feature consumers
        run: uv run python scripts/check_features.py

      - name: Test CLI native feature
        run: cargo test -p kagari-cli --features jit

  gc-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRIFLAGS: -Zmiri-strict-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-10-22 --profile minimal --component miri --component rust-src

      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-10-22 miri setup --target x86_64-unknown-linux-gnu

      - name: Check graph operations against independent reachability
        run: cargo +nightly-2026-10-22 miri test --locked -p kagari-gc --target x86_64-unknown-linux-gnu --test graph_model

      - name: Check layouts and failure cleanup
        run: cargo +nightly-2026-10-22 miri test --locked -p kagari-gc --target x86_64-unknown-linux-gnu --test failures --test layouts --no-fail-fast

      - name: Check typed access panic and quarantine contracts
        run: cargo +nightly-2026-10-22 miri test --locked -p kagari-gc --target x86_64-unknown-linux-gnu --lib access::fields::tests

      - name: Check shared access, erased layouts, thread transfer and execution roots
        run: cargo +nightly-2026-10-22 miri test --locked -p kagari-gc --target x86_64-unknown-linux-gnu --test ownership --test dynamic --test root_source --no-fail-fast -- shared_scope_reads following_an_edge_borrowed owning_handles layout_tokens scalar_domains frame_reuse_new_frontiers

  editor-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/package-lock.json

      - name: Install Python for node-gyp
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native grammar build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential

      # npm ci builds the native binding from the committed generated parser.
      # Generation and tests below use installed tools, not npx downloads.
      - name: Install locked editor dependencies and build native grammar
        timeout-minutes: 5
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm ci

      - name: Check generated parser consistency
        run: npm run check:generated

      - name: Test grammar corpus and selected syntax boundaries
        run: npm run test:grammar

      - name: Build and validate Zed WASM grammar (download official WASI SDK 34)
        timeout-minutes: 6
        run: npm run build:zed -- --download-sdk

      - name: Test Zed captures, configuration and WASM staging
        timeout-minutes: 6
        env:
          KAGARI_TEST_ZED_WASM: "1"
          WASI_SDK_PATH: ${{ github.workspace }}/target/editors/wasi-sdk-34.0-x86_64-linux
        run: npm run test:zed

      - name: Test VS Code tokenization and configuration
        run: npm run test:vscode

      - name: Test shared classification boundaries
        run: npm run test:shared

      - name: Parse complete syntax example inventory (CI only)
        run: npm run test:inventory

      - name: Package VS Code extension
        run: |
          mkdir -p ../target/editors
          npm run package:vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: kagari-vscode
          path: target/editors/*.vsix
          if-no-files-found: error

  windows-aot:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          python-version: "3.12"

      - name: Locate platform linker
        shell: pwsh
        run: |
          $aotLinker = 'C:\Program Files\LLVM\bin\lld-link.exe'
          if (-not (Test-Path -LiteralPath $aotLinker)) { throw 'lld-link is required for AOT acceptance' }
          "KAGARI_AOT_LINKER=$aotLinker" >> $env:GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test native deployment contracts
        run: cargo test --locked -p kagari --features aot-build --lib aot::tests --no-fail-fast

      - name: Enable symbolic links for formatter contracts
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Test Windows formatter replacement and link contracts
        run: 'cargo test --locked -p kagari-cli --bin kg formatting:: --no-fail-fast'

      - name: Test Windows toolchain command contracts
        run: cargo test --locked -p kagari-cli --test toolchain --no-fail-fast

      - name: Test Windows analyzer URI and document lifecycle contracts
        timeout-minutes: 5
        run: cargo test --locked -p kagari-analyzer --bin kagari-analyzer --no-fail-fast

      - name: Test Windows analyzer stdio lifecycle and Unicode CRLF input
        timeout-minutes: 5
        run: cargo test --locked -p kagari-analyzer --test stdio --no-fail-fast

      - name: Test CLI AOT and JIT arguments
        run: cargo test --locked -p kagari-cli --features aot,jit -- tests::parses tests::rejects_jit_for_aot_bundle

      - name: Prove independent compiler-free deployment
        run: uv run python scripts/check_aot.py
