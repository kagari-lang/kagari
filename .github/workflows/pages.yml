name: Pages

# No path filters: required PR checks must also finish on non-site changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main pushes and main dispatches share a group; PRs/other refs cannot cancel them.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked site dependencies
        timeout-minutes: 5
        run: npm ci --engine-strict

      # Moderate upstream findings remain visible; see site/README.md security boundary.
      - name: Reject high and critical dependency advisories
        timeout-minutes: 2
        run: npm audit --audit-level=high

      - name: Build site with type and content checks
        timeout-minutes: 8
        run: npm run build

      - name: Validate the exact build and all 24 guide pages
        timeout-minutes: 3
        run: npm run check -- --expected-pages 24

      # Upload immediately after validation: no second build or copied output tree.
      - name: Upload checked Pages output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages
          path: site/dist

  deploy:
    needs: build
    if: >-
      ${{ needs.build.result == 'success' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          vars.PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Concurrency cancels superseded runs; also reject manual reruns of old SHAs.
      # No checkout or repository-provided build code executes with deploy privileges.
      - name: Refuse a superseded main revision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('Refusing to publish a superseded main revision.');
            }

      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages
